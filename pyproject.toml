[project]
name = "go-db"
dynamic = ["version"]
description = "go-db"
authors = [
    { name = "Author 1", email = "author@org.org" },
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9,<4.0"
dependencies = [
    "click",
    "duckdb>=1.3.2,<2.0.0",
    "duckdb-engine>=0.11.2,<0.12.0",
    "pydantic>=2.6.4,<3.0.0",
    "pandas>=2.2.1,<3.0.0",
    "toml",
    "scipy>=1.13.0,<2.0.0",
    "oaklib>=0.6.1,<0.7.0",
    "papermill>=2.6.0,<3.0.0",
]

[project.scripts]
go-db = "go_db.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "linkml>=1.7.0",
    "mkdocs",
    "mkdocstrings[python]",
    "mkdocs-mermaid2-plugin",
    "mknotebooks",
    "mkdocs-windmill",
    "mkdocs-material",
    "tox",
    "pre-commit>=3.3.3",
    "ruff",
    "jupysql",
    "jupyter",
    "matplotlib",
    "seaborn",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
fallback_version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/go_db"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
extend-ignore = [
    "D211",  # `no-blank-line-before-class`
    "D212",  # `multi-line-summary-first-line`
    "D203",  # `blank-line-before-docstring`
    ]

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]

# Select or ignore from https://docs.astral.sh/ruff/rules/
select = [
    "B",  # bugbear
    "D",  # pydocstyle
    "E",  # pycodestyle errors
    "F",  # Pyflakes
    "I",  # isort
    "S",  # flake8-bandit
    "W",  # Warning
]

unfixable = []

[tool.ruff.lint.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10

[tool.codespell]
skip = "*.po,*.ts,.git,pyproject.toml"
count = ""
quiet-level = 3
# ignore-words-list = ""

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"
